name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    # Шаг 1: Получение кода из репозитория
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Шаг 2: Настройка Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # Шаг 3: Сборка Docker образа
    - name: Build Docker image
      run: |
        docker build -t my-app:latest .
    
    # Шаг 4: Запуск тестов с помощью pytest
    - name: Run tests with pytest
      run: |
        pip install -r requirements.txt
        pytest test_app.py -v
    
    # Шаг 5: Запуск контейнера и вывод фразы
    - name: Run container and display message
      run: |
        docker run --rm my-app:latest