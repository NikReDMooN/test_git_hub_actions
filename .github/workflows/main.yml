on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build Docker image
        run: |
          docker build -t my-app .

      - name: Check for app.py file with pytest
        run: |
          python -m pytest -c -k 'app.py' --disable-warnings 

      - name: Run Docker container
        run: |
          docker run my-app