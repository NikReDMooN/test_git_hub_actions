name: My Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-workflow-app .

      - name: Run pytest inside Docker
        run: docker run my-workflow-app pytest test_app.py

      - name: Run container and print message
        run: docker run my-workflow-app
