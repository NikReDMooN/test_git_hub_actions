on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform Docker)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub (optional)
        if: false
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t my-workflow-image:latest .

      - name: Run pytest
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
          pytest -q

      - name: Run container and print message
        run: |
          # Run container in background and capture logs
          CONTAINER_ID=$(docker run -d my-workflow-image:latest)
          # Wait a bit for the container to start
          sleep 2
          # Show container logs (should contain "it's my workflow")
          docker logs $CONTAINER_ID
          # Stop and remove the container
          docker stop $CONTAINER_ID
          docker rm $CONTAINER_ID